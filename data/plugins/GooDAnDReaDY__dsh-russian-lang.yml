name: GooDAnDReaDY/dsh-russian-lang
category: ui
description:
  en: Adds Russian as the third native option in Settings - General - Language for DeepSeek Harness (DSH v0.1.5-rc.1+), with 100% coverage across 6,002 UI keys (1,225 core + 4,777 companion plugins). Features unified dsh-clinebot visual design standard for settings card, Smart Russian UX (localized Markdown export, turn translation, live typography, slash command aliases, Alt+L layout fix), and runtime locale snapshot extension without modifying core files.
  zh: 将俄语作为第三个原生选项添加到 DeepSeek Harness (DSH v0.1.5-rc.1+) 网页 UI 的「设置 - 通用 - 语言」菜单中，100% 覆盖 6,002 个界面词条（1,225 个核心词条 + 4,777 个生态插件词条）。遵循 dsh-clinebot 统一视觉标准打造设置卡片，提供 Smart Russian UX（会话 Markdown 导出、消息内嵌翻译、实时排版、斜杠命令别名、Alt+L 布局更正）并在不修改核心文件的前提下通过运行时扩展 locale 快照。

